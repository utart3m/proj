<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
        }

        .login-card h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #333;
        }

        .login-card p {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .static-value {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            background-color: #f8fafc;
            color: #333;
            font-size: 14px;
            min-height: 38px;
            display: flex;
            align-items: center;
            word-break: break-word;
        }

        .balance-container {
            background-color: #f8fafc;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-label {
            color: #666;
            font-size: 14px;
        }

        /* Класс balance-value критически важен для обновления через JS */
        .balance-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .currency {
            color: #007bff;
            margin-left: 2px;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-family: inherit;
            display: block;
            text-align: center;
            box-sizing: border-box;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .btn-accent {
            background-color: #ff9800;
            color: white;
        }

        .btn-accent:hover {
            background-color: #e68a00;
        }

        .switch-link {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .switch-link a {
            color: #007bff;
            text-decoration: none;
            font-size: 14px;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Личный кабинет</h2>
        <p>Управляйте своим профилем и балансом</p>

        <div class="form-group">
            <label>Логин или Email</label>
            <div class="static-value">{{ user.username }}</div>
        </div>

        <div class="balance-container">
            <span class="balance-label">Текущий баланс:</span>
            <!-- Скрипт script.js будет заменять всё внутри этого тега -->
            <span class="balance-value">{{ user.balance }}<span class="currency">₽</span></span>
        </div>

        <button type="button" class="btn btn-primary" id="topup-btn" style="margin-bottom: 10px;">Пополнить баланс</button>
        <button type="button" class="btn btn-accent" id="make-request-btn">Сделать запрос (-3 ₽)</button>

        <div class="switch-link">
            <a href="/logout">Выйти из аккаунта</a>
        </div>
    </div>

    <script src="https://cloudflare.com" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="../static/script.js"></script>
</body>
</html>
